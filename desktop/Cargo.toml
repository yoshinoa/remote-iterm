[package]
name = "remote-iterm-desktop"
version = "0.1.0"
edition = "2024"

description = "Native window for the remote-iterm server"

[[bin]]
name = "remote-iterm"
path = "src/main.rs"

[package.metadata.packager]
product-name = "Remote iTerm"
identifier = "ca.jiye.remote-iterm.desktop"
before-packaging-command = "cargo build --release"
formats = ["nsis"]

[package.metadata.packager.nsis]
installer-icon = "assets/icon.ico"

[dependencies]
gpui = "=0.2.2"
rust_socketio = { version = "=0.6.0", features = ["async"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
unicode-width = "0.2"
dirs = "6"
base64 = "0.22"
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }
